#!/usr/sbin/nft -f

flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    # loopback
    iifname "lo" accept

    # established and related connections
    ct state established,related accept

    # icmp / icmpv6 ( NDP and friends )
    ip protocol icmp accept
    meta l4proto ipv6-icmp accept

    # ssh
    tcp dport 22 accept

    # web
    tcp dport { 80, 443 } accept

    # podman networks (container DNS via aardvark-dns and friends)
    iifname "podman*" accept

    # log anything else, then drop via policy
    limit rate 5/minute counter log prefix "nft-input-drop: "
    counter
  }

  chain forward {
    type filter hook forward priority filter; policy drop;

    # podman bridge traffic between containers
    iifname "podman*" oifname "podman*" accept
    iifname "podman*" accept
    counter
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
